<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone, Paper and Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stone, Paper and Scissors</h1>

    <div class="turn-container">
        <label for="total-turns">Select Total Turns: </label>
        <select id="total-turns">
            <option value="select" >select</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
        </select>
    </div>

    <div class = "choices">
        <div class="choice" id="rock">
            <img src="images/rock.png">
        </div>
         <div class="choice" id="paper">
             <img src="images/paper.png">
         </div>
         <div class="choice" id="scissors">
             <img src="images/scissors.png">
         </div>
    </div>

        <div class ="turn-info">
            <p id="turn-display">Turn: 0 / 0 </p>
        </div>

         <div class="score-board">
            <div class="score1">
                <p id="user-score">0</p>
                <p>You</p>
            </div>
            <div class="score2">
                <p id="comp-score">0</p>
                <p>Comp</p>
            </div>
          </div>

            <div class="msg-container1">
                <p id="msg1">Make Your Move</p>
            </div>

            <div class="msg-container2">
                <p id="msg2">Result</p>
            </div>

           <button id="Restart-btn">Restart Game </button>
       <script src="app.js"></script>
</body>
</html>
